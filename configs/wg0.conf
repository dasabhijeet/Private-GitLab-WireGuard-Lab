[Interface]
Address = 10.20.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY>
PostUp = sysctl -w net.ipv4.ip_forward=1; iptables -P FORWARD ACCEPT; iptables -t nat -A POSTROUTING -s 10.10.0.0/24 -o enp0s8 -j MASQUERADE
PostDown = iptables -t nat -D POSTROUTING -s 10.10.0.0/24 -o enp0s8 -j MASQUERADE

[Peer] # admin
PublicKey = <ADMIN_PUBLIC_KEY>
AllowedIPs = 10.20.0.2/32

[Peer] # dev1
PublicKey = <DEV1_PUBLIC_KEY>
AllowedIPs = 10.20.0.3/32

[Peer] # dev2
PublicKey = <DEV2_PUBLIC_KEY>
AllowedIPs = 10.20.0.4/32
